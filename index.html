<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>nuance</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="app">


    <!-- JOURNAL -->

    <main class="journal-area">

      <div
        class="journal"
        id="journal"
      >

        <div class="book-spine"></div>


        <!-- LEFT PAGE -->

        <section
          class="page page-left"
          id="leftPage"
        >

          <div class="page-content">

            <div class="page-date" id="leftDate"></div>

            <h1
              class="page-title"
              id="leftTitle"
            ></h1>

            <div
              class="page-text"
              id="leftText"
            ></div>

          </div>

          <div
            class="page-number"
            id="leftNumber"
          ></div>

        </section>


        <!-- RIGHT PAGE -->

        <section
          class="page page-right"
          id="rightPage"
        >

          <div class="page-content">

            <div class="page-date" id="rightDate"></div>

            <h1
              class="page-title"
              id="rightTitle"
            ></h1>

            <div
              class="page-text"
              id="rightText"
            ></div>

          </div>

          <div
            class="page-number"
            id="rightNumber"
          ></div>

        </section>

      </div>


      <!-- CONTROLS -->

      <div class="journal-controls">

        <button
          type="button"
          id="previousBtn"
        >
          ←
        </button>

        <span id="pageIndicator">
          1 / 1
        </span>

        <button
          type="button"
          id="nextBtn"
        >
          →
        </button>

      </div>


      <div class="small-controls">

        <button
          type="button"
          id="newEntryBtn"
        >
          + New Entry
        </button>

        <button
          type="button"
          id="searchBtn"
        >
          Search
        </button>

      </div>

    </main>


    <!-- ENTRY EDITOR -->

    <div
      class="modal hidden"
      id="editorModal"
    >

      <div class="editor">

        <button
          type="button"
          class="close-btn"
          id="closeEditorBtn"
        >
          ×
        </button>

        <div class="editor-label">
          NEW ENTRY
        </div>

        <input
          id="entryDate"
          type="date"
        >

        <input
          id="entryTitle"
          type="text"
          maxlength="100"
          placeholder="Title (optional)"
        >

        <textarea
          id="entryContent"
          placeholder="Write here..."
        ></textarea>

        <div class="editor-actions">

          <button
            type="button"
            id="cancelBtn"
          >
            Cancel
          </button>

          <button
            type="button"
            id="saveBtn"
          >
            Save Entry
          </button>

        </div>

        <div
          class="editor-status"
          id="editorStatus"
        ></div>

      </div>

    </div>


    <!-- SEARCH -->

    <div
      class="modal hidden"
      id="searchModal"
    >

      <div class="search-panel">

        <button
          type="button"
          class="close-btn"
          id="closeSearchBtn"
        >
          ×
        </button>

        <div class="editor-label">
          FIND AN ENTRY
        </div>

        <input
          id="searchInput"
          type="search"
          placeholder="Search your journal..."
        >

        <div
          id="searchResults"
          class="search-results"
        ></div>

      </div>

    </div>


    <div
      class="loading"
      id="loading"
    >
      opening the journal...
    </div>


  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="script.js"></script>

</body>

</html>
