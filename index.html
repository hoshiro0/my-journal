<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>migo's journal</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <div class="app">

    <!-- =========================
         JOURNAL
         ========================= -->

    <main class="journal" id="journal">

      <div class="book-shadow"></div>

      <!-- LEFT PAGE -->

      <section class="paper-page left-page">

        <div class="page-inner">

          <div class="entry-date" id="leftDate"></div>

          <h1 class="entry-title" id="leftTitle"></h1>

          <div
            class="entry-content"
            id="leftContent"
          ></div>

        </div>

        <span class="page-number" id="leftPageNumber"></span>

      </section>


      <!-- RIGHT PAGE -->

      <section class="paper-page right-page">

        <div class="page-inner">

          <div class="entry-date" id="rightDate"></div>

          <h1 class="entry-title" id="rightTitle"></h1>

          <div
            class="entry-content"
            id="rightContent"
          ></div>

        </div>

        <span class="page-number" id="rightPageNumber"></span>

      </section>


      <!-- PAGE TURN -->

      <div
        class="page-turn"
        id="pageTurn"
      ></div>


      <!-- EMPTY / LOADING -->

      <div
        class="loading"
        id="loading"
      >
        Opening the journal…
      </div>


      <!-- =========================
           CONTROLS
           ========================= -->

      <div class="journal-controls">

        <button
          type="button"
          id="prevBtn"
          aria-label="Previous page"
        >
          ←
        </button>

        <span id="pageIndicator">
          0 / 0
        </span>

        <button
          type="button"
          id="nextBtn"
          aria-label="Next page"
        >
          →
        </button>

      </div>


      <!-- =========================
           WRITE
           ========================= -->

      <button
        type="button"
        class="write-button"
        id="newEntryBtn"
      >
        + New Entry
      </button>

    </main>


    <!-- =========================
         EDITOR
         ========================= -->

    <section
      class="editor hidden"
      id="editor"
    >

      <div class="editor-paper">

        <button
          type="button"
          class="close-editor"
          id="cancelBtn"
        >
          ×
        </button>

        <p class="editor-heading">
          A new page
        </p>

        <label>
          Date
          <input
            id="entryDate"
            type="date"
          >
        </label>

        <label>
          Title
          <input
            id="entryTitle"
            type="text"
            placeholder="Give this page a name..."
          >
        </label>

        <label>
          Your thoughts
          <textarea
            id="entryContent"
            placeholder="Write here..."
          ></textarea>
        </label>

        <div class="editor-actions">

          <button
            type="button"
            id="saveBtn"
          >
            Save Entry
          </button>

          <button
            type="button"
            id="deleteBtn"
            class="danger hidden"
          >
            Delete Entry
          </button>

        </div>

        <p
          id="editorStatus"
          class="editor-status"
        ></p>

      </div>

    </section>

  </div>


  <!-- =========================
       SUPABASE
       ========================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="script.js"></script>

</body>
</html>
